<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>授课台｜{{COURSE_TITLE}}</title>
<style>
:root{--bg:#141414;--panel:#1e1e1e;--line:#333;--tx:#eee;--mut:#9a9a9a;--or:#ff7a1a;--red:#ff5a5a;--blue:#58a6ff;--amb:#f2c14e;--grn:#4cc38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid #444;background:#2a2a2a;color:var(--tx);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--or)}
button.pri{background:var(--or);border-color:var(--or);color:#111;font-weight:700}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);background:#101010;flex-wrap:wrap}
header .sec{color:var(--or);font-weight:700}
header .grow{flex:1}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{padding:3px 10px;border-radius:99px;font-size:13px;background:#2a2a2a}
.ok{color:var(--grn)}.warn{color:var(--amb)}.bad{color:var(--red)}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);gap:12px;padding:12px;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;min-height:0}
.slide{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:1672/941}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.slide .qr{position:absolute;display:flex;align-items:center;justify-content:center}
.slide .qr img{height:90%;width:auto;object-fit:contain}
.nextbox{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px}
.nextbox img{width:180px;border-radius:6px}
.nextbox .t{font-size:14px;color:var(--mut)}
.nextbox b{color:var(--tx);font-size:16px}
.right{background:var(--panel);border-radius:10px;padding:14px 16px;overflow:auto;min-height:0}
.right h1{font-size:24px;margin:0 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--mut)}
.blk{margin:12px 0}
.blk .lab{font-size:12px;letter-spacing:.1em;color:var(--mut);margin-bottom:4px}
.say{font-size:19px;line-height:1.75;white-space:pre-wrap}
.txt{font-size:16px;line-height:1.65;white-space:pre-wrap}
.box{border-radius:8px;padding:9px 12px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.fb{background:#3a1d1d;border-left:4px solid var(--red)}
.cold{background:#162a40;border-left:4px solid var(--blue)}
.fix{background:#3a3115;border-left:4px solid var(--amb)}
.task{background:#1f3326;border-left:4px solid var(--grn);font-size:17px}
.assets{display:flex;flex-wrap:wrap;gap:8px}
.assets button{background:#2b2218;border-color:#6b4a2b}
footer{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:#101010;flex-wrap:wrap}
footer input{width:64px;font:inherit;background:#222;color:var(--tx);border:1px solid #444;border-radius:8px;padding:6px}
#toc{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20}
#toc .inner{position:absolute;left:0;top:0;bottom:0;width:min(560px,92vw);background:#181818;overflow:auto;padding:14px}
#toc h3{color:var(--or);margin:16px 0 6px;font-size:15px}
#toc a{display:flex;gap:10px;padding:5px 8px;border-radius:6px;color:var(--tx);text-decoration:none;font-size:14px}
#toc a:hover,#toc a.cur{background:#2e2416}
#toc a span{color:var(--mut);font-variant-numeric:tabular-nums;min-width:98px}
#mirror{position:fixed;inset:0;background:#000;display:none;z-index:30;align-items:center;justify-content:center}
#mirror img{max-width:100%;max-height:100%}
#mirror .hint{position:absolute;bottom:8px;right:12px;color:#555;font-size:12px}
#toast{position:fixed;right:16px;bottom:70px;max-width:520px;background:#3a1d1d;border:1px solid var(--red);padding:10px 14px;border-radius:8px;display:none;z-index:40;font-size:15px;line-height:1.5}
.brk{color:var(--amb);font-size:14px;margin-top:4px}
kbd{background:#333;border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<div id="app">
 <header>
  <span class="pill" id="day"></span>
  <span class="sec" id="sec"></span>
  <span class="grow"></span>
  <span>本页计划 <b class="big" id="plan"></b></span>
  <span>现在 <b class="big" id="now"></b></span>
  <span id="drift" class="pill"></span>
  <span>本页已用 <b class="big" id="elapsed">0:00</b> / <span id="planmin"></span></span>
 </header>
 <main>
  <div class="left">
   <div class="slide" id="slide"><img id="slideImg" alt=""></div>
   <div class="nextbox" id="nextbox"><img id="nextImg" alt=""><div><div class="t">下一页 <span id="nextTime"></span></div><b id="nextTitle"></b></div></div>
  </div>
  <div class="right" id="right"></div>
 </main>
 <footer>
  <button id="tocBtn">目录</button>
  <button id="prev">◀ 上一页</button>
  <button id="next" class="pri">下一页 ▶</button>
  <span>跳到 <input id="jump" type="number" min="1" max="77"></span>
  <span class="grow" style="flex:1"></span>
  <button id="openProj" class="pri">打开独立投屏窗口</button>
  <button id="backSlide">投屏回到课件</button>
  <button id="cdBtn" style="display:none">投屏倒计时</button>
  <button id="pickFile">选本地文件投屏</button>
  <button id="mirrorBtn">本页投屏（单屏）</button>
  <span style="color:var(--mut);font-size:12px"><kbd>←</kbd><kbd>→</kbd>翻页 <kbd>Esc</kbd>退出单屏</span>
  <input type="file" id="fileIn" style="display:none" accept="video/*,image/*">
 </footer>
</div>
<div id="toc"><div class="inner" id="tocInner"></div></div>
<div id="mirror"><img id="mirrorImg" alt=""><div class="hint">Esc 返回授课台</div></div>
<div id="toast"></div>

<script src="lesson-data.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const img=p=>"01_课件/p"+String(p).padStart(2,"0")+".jpg";
let idx=0, enteredAt=Date.now(), proj=null, pendingAssetName="";
try{const s=parseInt(localStorage.getItem("tt_lesson_page"));if(s>=1&&s<=LESSON.length)idx=s-1;}catch(e){}

function toMin(s){const [h,m]=s.split(":").map(Number);return h*60+m;}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function toast(msg){const t=$("toast");t.innerHTML=msg;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",9000);}

function send(msg){ if(proj&&!proj.closed){ try{proj.postMessage(msg,"*");}catch(e){} } }
function projState(){const x=LESSON[idx];return {type:"slide",src:img(x.p),overlay:x.overlay||null};}

function render(){
 const x=LESSON[idx], n=LESSON[idx+1];
 $("day").textContent=x.day; $("sec").textContent=x.sec;
 $("plan").textContent=x.time; $("planmin").textContent=x.min+" 分钟";
 $("slideImg").src=img(x.p);
 // QR overlay preview
 [...$("slide").querySelectorAll(".qr")].forEach(e=>e.remove());
 if(x.overlay){const o=x.overlay,d=document.createElement("div");d.className="qr";
  d.style.cssText=`left:${o.x*100}%;top:${o.y*100}%;width:${o.w*100}%;height:${o.h*100}%`;
  const q=new Image();q.src=o.img;q.onerror=()=>{d.innerHTML='<span style="color:#c00;font-weight:700;font-size:13px;text-align:center;background:#fff;padding:4px">缺二维码：<br>'+esc(o.img)+'</span>';};d.appendChild(q);$("slide").appendChild(d);}
 if(n){$("nextImg").src=img(n.p);$("nextTitle").textContent="P"+n.p+"｜"+n.t;$("nextTime").textContent=n.time;$("nextbox").style.visibility="visible";}
 else{$("nextbox").style.visibility="hidden";}
 let h=`<h1>P${x.p}｜${esc(x.t)}</h1><div class="meta"><span class="pill">${esc(x.type)}</span><span class="pill">${x.time}（${x.min}分钟）</span>`;
 if(x.countdown)h+=`<span class="pill">投屏倒计时 ${x.countdown} 分钟</span>`;
 h+=`</div>`;
 if(x.brkTime)h+=`<div class="brk">本页之后：课间/机动 ${x.brkTime}</div>`;
 if(x.task)h+=`<div class="blk"><div class="lab">学员此刻要做</div><div class="box task">${esc(x.task)}</div></div>`;
 h+=`<div class="blk"><div class="lab">讲稿（引号内可以直接说）</div><div class="say">${esc(x.say)}</div></div>`;
 if(x.act)h+=`<div class="blk"><div class="lab">讲师动作</div><div class="txt">${esc(x.act)}</div></div>`;
 if(x.assets.length){h+=`<div class="blk"><div class="lab">本页素材（点了就在投屏窗口播放）</div><div class="assets">`;
  x.assets.forEach((a,i)=>{h+=`<button data-a="${i}">${a.k==="dir"?"📁 ":a.k==="img"?"🖼 ":a.k==="page"?"📄 ":a.k==="url"?"🌐 ":"▶ "}${esc(a.n)}</button>`;});
  h+=`</div></div>`;}
 h+=`<div class="blk"><div class="lab">出问题怎么办</div><div class="box fb">${esc(x.fb)}</div></div>`;
 if(x.cold)h+=`<div class="blk"><div class="lab">冷场版</div><div class="box cold">${esc(x.cold)}</div></div>`;
 if(x.fix)h+=`<div class="blk"><div class="lab">课前核对（仅讲师）</div><div class="box fix">${esc(x.fix)}</div></div>`;
 $("right").innerHTML=h; $("right").scrollTop=0;
 $("right").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>playAsset(x.assets[+b.dataset.a]));
 $("cdBtn").style.display=x.countdown?"inline-block":"none";
 if(x.countdown)$("cdBtn").textContent="投屏倒计时 "+x.countdown+" 分钟";
 enteredAt=Date.now(); tick();
 try{localStorage.setItem("tt_lesson_page",String(x.p));}catch(e){}
 send(projState());
 if($("mirror").style.display==="flex")$("mirrorImg").src=img(x.p);
 document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("cur",+a.dataset.i===idx));
}
function go(i){if(i<0||i>=LESSON.length)return;idx=i;render();}

function playAsset(a){
 if(a.k==="dir"){pendingAssetName=a.n;toast("这是一个文件夹：<b>"+esc(a.f)+"</b><br>请在弹出的选择框里挑一个文件，它会直接投到投屏窗口。");$("fileIn").click();return;}
 if(a.k==="url"){window.open(a.f,"_blank");toast("在线视频已在新窗口打开：拖到投影屏播放。打不开就按本页「出问题怎么办」。");return;}
 if(!proj||proj.closed){toast("还没打开投屏窗口：先点下方「打开独立投屏窗口」，拖到投影屏。");return;}
 send({type:a.k==="img"?"img":a.k==="page"?"page":"video",src:a.f,name:a.n});
}
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(!proj||proj.closed){toast("还没打开投屏窗口。");return;}
 send({type:"file",file:f,name:f.name});e.target.value="";};
$("pickFile").onclick=()=>{pendingAssetName="";$("fileIn").click();};

$("openProj").onclick=()=>{
 proj=window.open("投屏窗口.html","tt_projection","width=1280,height=720");
 if(!proj){toast("浏览器拦截了弹窗：地址栏右侧允许弹出窗口后再点一次。");return;}
 setTimeout(()=>send(projState()),600);
 toast("投屏窗口已打开：拖到投影屏，在那个窗口里点一下再按 <b>F</b> 全屏。");
};
$("backSlide").onclick=()=>send(projState());
$("cdBtn").onclick=()=>send({type:"countdown",min:LESSON[idx].countdown});
window.addEventListener("message",e=>{const d=e.data||{};
 if(d.type==="ready")send(projState());
 if(d.type==="asset-error")toast("<b>素材没找到/播不了：</b>"+esc(d.src)+"<br>按本页「出问题怎么办」继续，台上不排障。");
});

$("prev").onclick=()=>go(idx-1); $("next").onclick=()=>go(idx+1);
$("jump").onchange=e=>{const v=parseInt(e.target.value);if(v>=1&&v<=LESSON.length)go(v-1);e.target.value="";};
$("mirrorBtn").onclick=()=>{$("mirrorImg").src=img(LESSON[idx].p);$("mirror").style.display="flex";try{document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(idx+1);}
 if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(idx-1);}
 if(e.key==="Escape"){$("mirror").style.display="none";$("toc").style.display="none";try{document.exitFullscreen();}catch(err){}}
});
// TOC
(function(){let h="",last="";LESSON.forEach((x,i)=>{if(x.sec!==last){h+=`<h3>${esc(x.day)}｜${esc(x.sec)}</h3>`;last=x.sec;}
 h+=`<a href="#" data-i="${i}"><span>${x.time}</span>P${x.p}｜${esc(x.t)}</a>`;});
 $("tocInner").innerHTML=h;
 $("tocInner").querySelectorAll("a").forEach(a=>a.onclick=ev=>{ev.preventDefault();$("toc").style.display="none";go(+a.dataset.i);});})();
$("tocBtn").onclick=()=>{$("toc").style.display="block";};
$("toc").onclick=e=>{if(e.target.id==="toc")$("toc").style.display="none";};

function tick(){
 const d=new Date(),nm=d.getHours()*60+d.getMinutes();
 $("now").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
 const x=LESSON[idx],st=toMin(x.start),diff=nm-st;
 const el=$("drift");
 if(Math.abs(diff)>180){el.textContent="不在上课时段";el.className="pill";}
 else if(diff<=2&&diff>=-2){el.textContent="准点";el.className="pill ok";}
 else if(diff>0){el.textContent="落后 "+diff+" 分钟";el.className="pill "+(diff>8?"bad":"warn");}
 else{el.textContent="提前 "+(-diff)+" 分钟";el.className="pill ok";}
 const s=Math.floor((Date.now()-enteredAt)/1000);
 $("elapsed").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 $("elapsed").className="big "+(s/60>x.min?"bad":"");
}
setInterval(tick,1000);
render();
})();
</script>
</body>
</html>
