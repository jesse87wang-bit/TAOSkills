crosoft YaHei',sans-serif" font-size="19" text-anchor="middle" opacity="1.0" style="white-space:pre"><tspan x="900.0" dy="0.0">自己整理</tspan></text><polyline points="1010.0,615.0 1070.0,615.0" fill="none" stroke="#1e1e1e" stroke-width="2" opacity="1.0" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="1080.0" y="570.0" width="160.0" height="90.0" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1.0"/><text x="1160.0" y="618.7" fill="#1e1e1e" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" text-anchor="middle" opacity="1.0" style="white-space:pre"><tspan x="1160.0" dy="0.0">出报告</tspan></text><polyline points="1270.0,610.0 1370.0,610.0" fill="none" stroke="#1e1e1e" stroke-width="2" opacity="1.0" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="1380.0" y="560.0" width="150.0" height="100.0" rx="12" fill="#e9ecef" stroke="#343a40" stroke-width="2" opacity="1.0"/><text x="1455.0" y="614.3" fill="#1e1e1e" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" opacity="1.0" style="white-space:pre"><tspan x="1455.0" dy="0.0">报告</tspan></text><text x="870.0" y="713.9" fill="#2f9e44" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" text-anchor="middle" opacity="1.0" style="white-space:pre"><tspan x="870.0" dy="0.0">全程不烦你</tspan></text><rect x="230.0" y="790.0" width="1140.0" height="100.0" rx="12" fill="#fff9db" stroke="#f5c451" stroke-width="2" opacity="1.0"/><text x="246.0" y="831.8" fill="#1e1e1e" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" text-anchor="start" opacity="1.0" style="white-space:pre"><tspan x="246.0" dy="0.0">大模型是「我知道很多」，Agent 是「我帮你把事做完」。</tspan><tspan x="246.0" dy="23.8">过去是人使用软件，未来越来越像人管理 AI 员工。</tspan></text></svg>