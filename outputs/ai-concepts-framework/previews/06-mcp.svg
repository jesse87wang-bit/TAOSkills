ine points="1310.0,390.0 1360.0,382.0 1390.0,382.0" fill="none" stroke="#6741d9" stroke-width="2" opacity="1.0" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="1400.0" y="460.0" width="160.0" height="84.0" rx="12" fill="#e9ecef" stroke="#343a40" stroke-width="2" opacity="1.0"/><text x="1480.0" y="505.5" fill="#1e1e1e" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="18" text-anchor="middle" opacity="1.0" style="white-space:pre"><tspan x="1480.0" dy="0.0">搜索引擎</tspan></text><polyline points="1310.0,390.0 1360.0,502.0 1390.0,502.0" fill="none" stroke="#6741d9" stroke-width="2" opacity="1.0" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="850.0" y="600.0" width="690.0" height="130.0" rx="12" fill="#fff9db" stroke="#f5c451" stroke-width="2" opacity="1.0"/><text x="866.0" y="646.0" fill="#1e1e1e" font-family="'Excalifont','Virgil','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="18" text-anchor="start" opacity="1.0" style="white-space:pre"><tspan x="866.0" dy="0.0">Agent 不需要知道每个系统怎么运作，</tspan><tspan x="866.0" dy="22.5">它只跟 MCP 对话 ——</tspan><tspan x="866.0" dy="22.5">订机票、发邮件、查数据，一个接口搞定。</tspan></text></svg>